[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-successor"
version = "0.1.0"
description = "Harness-first modular trading research and execution platform."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "joblib>=1.2",
  "scikit-learn>=1.3",
  "langgraph>=0.4",
  "langchain>=0.3",
  "pyzmq>=25.1.2",
  "optuna>=3.6",
  "PySide6>=6.6",
  "MetaTrader5>=5.0",
  "xgboost>=2.0",
  "pyarrow>=14.0",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = [
  "agents*",
  "adapters*",
  "data*",
  "desktop*",
  "detectors*",
  "features*",
  "governance*",
  "harness*",
  "integration*",
  "ml*",
  "monitoring*",
  "orchestration*",
  "paper_trading*",
  "risk*",
  "signals*",
]
exclude = [
  "tests*",
  "results*",
  "MQL5*",
  "mcps*",
  "models*",
  "terminals*",
  "fixtures*",
  "scripts*",
  "build*",
  ".atl*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "harness"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
