name: FASE-A-SEMANTIC

# Cierre semantico del motor (FASE A del Director, 2026-08-13).
# RUNNER LIGERO: usa generate_sequence_signals (-> run_sequence_traced) que RETORNA
# las senales CON event_ids/event_objects (linaje real). NO usa run_sequence_backtest
# (que descarta signals y simula PnL). Carga solo D1/H4/H1/M15. Sin fase de simulacion.
# Telemetria viva: etapas, PID, CPU/RAM, heartbeat 5s, .jsonl historico, .json estado.
# NO toca engine/. Audita dimensiones SDD_GOVERNANCE §4 via phase6_verifier.

on:
  workflow_dispatch:
    inputs:
      window_months:
        description: "Meses de M15 a auditar (default 2)"
        required: false
        default: "2"
  push:
    branches: [feature/backtest-ict]
    paths:
      - 'scripts/fase_a_semantic_light.py'
      - 'engine/sequence.py'
      - 'engine/expediente.py'
      - 'ict_backtest/rules.py'
      - 'ict_backtest/run_backtest.py'
      - '.github/workflows/fase-a-semantic.yml'

jobs:
  fase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow psutil
      - name: Run FASE A semantic audit (light, runner)
        run: python scripts/fase_a_semantic_light.py 2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-a-semantic-report
          path: |
            results/fase_a_semantic_eurhusd_LIGHT.md
            results/fase_a_semantic_eurhusd_LIGHT.json
            results/fase_a_light_state.json
            results/fase_a_light_history.jsonl
          if-no-files-found: warn
