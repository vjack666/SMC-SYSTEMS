name: FASE-A-SEMANTIC

# Cierre semantico del motor (FASE A del Director, 2026-08-13).
# Consumidor puro del motor sobre datos reales EURUSD (3 meses de M15).
# Audita el grafo causal con HYP-002/phase6_verifier (dimensiones SDD_GOVERNANCE §4).
# NO toca engine/. NO optimiza. NO crea SDD.
#
# NOTA (fix run 31739223530): se quita `pip install -e .` porque arrastra el
# paquete smc-successor (bot HISTORICO, no cableado) que exige MetaTrader5/PySide6
# inexistentes en el runner Linux. Los paquetes engine/ ict_backtest/ detectors/
# research/ son importables como fuente plana (sys.path.insert(0,'.')), igual que
# en pilot-phase6-a.yml. Solo se necesita pandas/numpy/pyarrow para leer parquet.

on:
  workflow_dispatch:
    inputs:
      window_months:
        description: "Meses de M15 a auditar (default 3)"
        required: false
        default: "3"
  push:
    branches: [feature/backtest-ict]
    paths:
      - 'scripts/fase_a_cloud.py'
      - 'engine/sequence.py'
      - 'engine/expediente.py'
      - 'ict_backtest/rules.py'
      - 'ict_backtest/run_backtest.py'
      - '.github/workflows/fase-a-semantic.yml'

jobs:
  fase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow
      - name: Run FASE A semantic audit (3 months)
        run: python scripts/fase_a_cloud.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-a-semantic-report
          path: |
            results/fase_a_semantic_eurhusd_CLOUD.md
            results/fase_a_semantic_eurhusd_CLOUD.json
          if-no-files-found: warn
