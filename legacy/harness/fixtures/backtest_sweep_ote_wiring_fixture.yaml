# Fixture de ablación sweep + OTE (Ítem D).
# SOLO diseño: ejecutable TRAS aplicar Ítem D a signals/pipeline.py y backtest/engine.py.
# Hoy el adapter `backtest` IGNORA enable_sweep_filter / enable_ote_filter.
#
# AVISO OVERFITTING: ablación IN-SAMPLE sobre data/raw H4. No fusionar hasta correr
# walk-forward OOS (PurgedKFold) por el usuario.
events: []
parameters:
  mode: backtest
  # --- 3 ramas de ablación: mismos datos, distinto cableado de filtros ---
  ablation_branches:
    - name: without_sweep_ote        # baseline de producción (confluence actual)
      scalping_config:
        enable_sweep_filter: false
        enable_ote_filter: false
      metrics: [pf, wr, n_trades]
    - name: with_sweep_only          # solo filtro de calidad por sweep
      scalping_config:
        enable_sweep_filter: true
        enable_ote_filter: false
        sweep_lookback: 8
        sweep_weight: 2.0
      metrics: [pf, wr, n_trades]
    - name: with_sweep_and_ote       # Ítem D completo
      scalping_config:
        enable_sweep_filter: true
        enable_ote_filter: true
        sweep_lookback: 8
        sweep_weight: 2.0
        ote_weight: 1.0
      metrics: [pf, wr, n_trades]
  config:
    data_dir: data/raw
    symbols: [EURUSD, GBPUSD, NZDUSD]
    timeframe: H4
    use_ml_quality_filter: true
    max_bars: null
  # Métrica del plan: with_sweep_and_ote NO debe degradar WR/PF vs without_sweep_ote.
  # El adapter itera las 3 ramas y reporta PF/WR/N-trades por rama.
