# Fixture para medir el efecto de invalidación/envejecimiento de detectores (Ítem E).
# SOLO diseño: ejecutable tras aplicar Ítem E a detectors/* y signals/pipeline.py.
#
# AVISO: el ON/OFF de invalidación reduce trade-count. No fusionar hasta correr
# walk-forward OOS (PurgedKFold) y mantener total_trades >= 200 (backtest/engine.py:545).
events: []
parameters:
  mode: backtest
  config:
    data_dir: data/raw
    symbols: [EURUSD, GBPUSD, XAUUSD, NZDUSD, USDCAD, USDCHF, USDJPY, AUDUSD]
    timeframe: H4
    use_ml_quality_filter: true
    max_bars: null
  # --- Barrido de invalidación/envejecimiento ---
  # off: baseline hoy (BOS/CHOCH/OB viven para siempre; FVG ignora fill status)
  # on:  BOS/CHOCH/OB ganan estado invalidated/aged (max_age por defecto 20-24 barras);
  #      FVG empieza a consumir fvg_fill_status en confluence_score
  detector_invalidation_sweep:
    - name: off
      detector_invalidation: false   # comportamiento de producción actual
    - name: on
      detector_invalidation: true    # Ítem E aplicado: bos_status/choch_status/ob_status + fvg_fill
  # Métrica de éxito del plan (STRATEGY_IMPROVEMENT_PLAN.md:135):
  #   reducir falsos positivos (trades sobre conceptos muertos)
  #   SIN caer PF > 5%, y manteniendo total_trades >= 200.
  # El adapter itera detector_invalidation_sweep y reporta por variante:
  #   profit_factor, win_rate, total_trades, max_drawdown_pct.
  success_criteria:
    max_profit_factor_drop_pct: 5.0
    min_total_trades: 200
