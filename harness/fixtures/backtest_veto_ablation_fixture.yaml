events: []
parameters:
  mode: backtest
  config:
    data_dir: data/raw
    symbols: [EURUSD, GBPUSD, XAUUSD, NZDUSD, USDCAD, USDCHF, USDJPY]
    timeframe: H4
    # Sin filtro ML para aislar el efecto del veto (ICT/Wyckoff puros)
    use_ml_quality_filter: false
    max_bars: null
  # ---------------------------------------------------------------------------
  # Bloque de ablación Ítem F. Lo lee el backtest SOLO cuando se implemente
  # conflict_mode en DecisionConfig (ver docs/proposals/item_F.md).
  # El adapter itera los dos modos sobre los MISMOS datos H4 y compara PF.
  # Clave 'ablation' fuera de 'config' -> no rompe CombinedBacktestConfig actual.
  ablation:
    metric: profit_factor
    compare_against: oos_walk_forward   # ambos modos deben medirse OOS
    decision_override:
      soft:
        # Comportamiento ACTUAL: resta conflict_penalty=0.15 a la confianza
        conflict_mode: soft
        conflict_penalty: 0.15
      hard:
        # Veto DURO: señal NEUTRAL si ICT y Wyckoff contradicen
        conflict_mode: hard
