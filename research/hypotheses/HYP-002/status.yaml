id: HYP-002
title: "¿El motor reconstruye de forma determinista la formación completa de un setup ICT/SMC?"
type: reading_hypothesis      # regla rectora (lectura), NO rendimiento
origin:
  rule: "RESEARCH_CONTRACT.md §16 (regla rectora 2026-08-10)"
  from_paradigm_shift: "Sustituye a HYP-001 como hipótesis RECTORA; HYP-001 queda como trazabilidad."
  prompted_by: "Revisión del Director en GitHub (rama feature/backtest-ict)"
status: en_prueba            # formulada -> auxiliares -> en_prueba -> promovida|refutada|inconclusa
# 2026-08-10: Piloto 1 AUTORIZADO por el Director bajo regla rectora estricta (14 condiciones).
# 2026-08-11 (orden Director): NO ejecutar piloto hasta cerrar puerta de RECONSTRUCCION.
#   Paso 1 (HECHO): SETUP_AUDITOR_RECONSTRUCTION_AUDIT.md — clasifica cada relacion causal del
#   auditor como OBSERVABLE / DERIVABLE SIN INTERPRETACION / INTERPRETACION NUEVA. Puerta
#   CERRADA Y CONSISTENTE: el auditor NO introduce 2da tesis; usa los MISMOS detectores del motor.
#   Paso 2 (PENDIENTE autorizacion): reescribir pilot1_run.py (Opcion B: evita import ict_backtest,
#   que arrastra rules.py bug datetime) y ejecutar 5 setups como auditoria de formacion.
pilot1:
  authorized_by: "Director (revision GitHub feature/backtest-ict)"
  rule: "NO medir WR/PF/edge; auditar formacion real; separar observado/reconstruido/inferido"
  mode: "background (recogiendo emisiones reales del motor)"
  target: "5 setups reales emitidos por el motor (>=5 confirmado: 79 en prueba de emision)"
  constraints: "no tocar engine/, no backtester, no optimizar, ATR descriptivo, Macro=UNKNOWN"
  output: "pilot1_output.md (fichas forenses por transicion)"
  emitted_count_check: "79 setups reales (EURUSD 29, AUDUSD 29, GBPUSD 21 en 20k velas M15)"
created: 2026-08-10
is_parent: true              # hipótesis rectora del laboratorio bajo la regla nueva
is_rector_hypothesis: true
primary_variable: "R_recon (tasa de reconstrucción determinista del setup completo)"
not_primary: "WR / PF (son consecuencia posterior, paso 6 del orden rector)"
domain:
  real: "setups emitidos por engine/ sobre datos reales del motor"
  otc: "backtest canónico (ict_backtest/run_backtest) como consumidor puro del motor"
layers_audit:                # qué significa 'setup completo' (cadena causal)
  - contexto: "sesgo HTF D1/H4/H1 vigente"
  - estructura: "BOS/CHOCH/MSS vigente"
  - liquidez: "BSL/SSL disponible"
  - evento: "qué fue tomado/swept"
  - displacement: "desplazamiento real posterior al evento"
  - estructura2: "BOS/CHOCH ocurrió después del evento correcto"
  - poi: "POI nació del evento correcto (anclado)"
  - retorno: "precio volvió al POI esperado"
  - ltf: "confirmación en timeframe de ejecución"
  - macro: "noticias/eventos que rodean el setup (capa de CONTEXTO EXTERNO, no indicador)"
  - estado: "setup válido o invalidado"
macro_layer: "Contexto externo: NO es BUY/SELL; explica/invalida/contextualiza/eleva la lectura."
experiments: []              # ninguno creado (prohibido por orden: sin EXP, sin Python)
experiment_lock:
  no_python_change: true
  no_backtest_run: true
  no_exp_created: true
performance_blocked_until_reading_validated: true   # WR/PF SOLO tras validar la lectura
relation_to_HYP_001:
  HYP-001: "CONSERVADA como trazabilidad del paradigma anterior; exp_001_blocked: true"
  HYP_002_role: "hipótesis rectora bajo regla nueva; cadena LECTURA->FORMACION->VALIDACION MACRO->SETUP AUDITADO->PERFORMANCE"
next_gate: "Diseñar EXP de LECTURA que reconstruya la cadena causal vela por vela (sin medir WR). Autorización del Director."
setup_spec: "SETUP_SPEC.md (anatomía por capas + linaje causal + macro contexto + umbral TBD)"
setup_auditor_design: "SETUP_AUDITOR_DESIGN.md (visión general: juez forense, no 2do motor)"
setup_auditor_protocol: "SETUP_AUDITOR_PROTOCOL.md (protocolo EXP-READ-001: entrada/salida, taxonomía 11 canónica resuelve 11vs9, PASS/FAIL/UNKNOWN, causalidad, COMPLETE, muestra 5-10->50->100)"
setup_auditor_protocol_audit: "SETUP_AUDITOR_PROTOCOL_AUDIT.md (auditoría del determinismo: matriz 11 capas, ambigüedades B1-B8, decisiones C1-C7 pre-piloto, TBD, propuesta Piloto 1 de 5)"
setup_auditor_c1_c7: "SETUP_AUDITOR_C1_C7.md (cierre documental C1-C7: evidencia mínima 4-preguntas/capa, jerarquía veredicto, consistencia 4 docs, condiciones piloto)"
setup_auditor_reconciliation: "SETUP_AUDITOR_RECONCILIATION.md (reconciliación final: retira umbral C2, separa causalidad demostrable de NO demostrable en C3, C4/C5 no-invención, SETUP_SPEC§4<->C7: piloto audita EMISIONES no setups completos)"
setup_auditor_data_forensics: "SETUP_AUDITOR_DATA_FORENSICS.md (auditoría forense de datos: run_sequence_traced expone Expediente; parquet raw SOLO OHLC; 5/6 forex symbols con D1/H4/M15, EURUSD+H1; linaje no embolsado)"
setup_auditor_atr_audit: "SETUP_AUDITOR_ATR_AUDIT.md (auditoría contradicción ATR vs Ley Fundamental: motor usa geometría pura avg_candle_range, no indicador; C2/C5 blindados sin ATR)"
setup_auditor_pilot_prep: "PILOT_PREP_MATRIX.md (matriz de preparación: el motor guarda SOLO indices, no ligaduras; 3 uniones no demuestran identidad causal -> UNKNOWN/BROKEN; PILOTO LISTO)"
setup_auditor_reconstruction_audit: "SETUP_AUDITOR_RECONSTRUCTION_AUDIT.md (auditoria de reglas de reconstruccion offline 2026-08-11: cada relacion causal del auditor clasificada OBSERVABLE/DERIVABLE/INTERPRETACION_NUEVA; puerta CERRADA: sin 2da tesis escondida; 3 uniones = UNKNOWN; macro GAP-1)"
reconcile_note: "Regla superior: el auditor NO reconstruye retrospectivamente causalidad no observable -> UNKNOWN/BROKEN. Piloto = 5 EMISIONES del motor, no setups completos. Emisiones NO persistidas; obtenibles via run_sequence_traced sin tocar engine/. ATR auditado: la columna 'atr' del motor es alias de avg_candle_range (geometría pura); C2/C5 blindados sin indicador. Causalidad 1:1 no demostrable con datos actuales (motor guarda solo indices); piloto emite UNKNOWN/BROKEN donde falte identidad."
threshold_status: "R_recon NO fijado numericamente (decisión Director 2026-08-10); SETUP_SPEC.md debe operar primero"
freeze_other_lines:
  HYP_001: "CONGELADA como trazabilidad del paradigma anterior; no dirige el laboratorio; exp_001_blocked: true"
  CAND_03_05: "ARCHIVADOS/bloqueados (paradigma anterior, giro alrededor de aligned_hit_pct/WR/PF). NO ejecutar ahora. No eliminados."
  directive: "No ejecutar CAND-03/05, no EXP-001, no buscar WR, no modificar el motor hasta validar la lectura."
